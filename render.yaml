# Render "Blueprint": lets you deploy by clicking New + > Blueprint and pointing at your GitHub repo.
services:
  - type: web
    name: renewable-energy-monitoring
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPEN_DOCS_ON_START
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: AUTH_USERNAME
        value: admin
      - key: AUTH_PASSWORD
        sync: false          # Render asks you to type this in; it is never stored in Git
      - key: AUTH_SECRET
        generateValue: true  # Render creates a long random secret for signing logins
